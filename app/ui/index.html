<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>MC-Migrate</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">MC</div>
      <div>
        <h1>MC-Migrate</h1>
        <p>Minecraft 模組版本升級 AI 工具</p>
      </div>
    </div>
    <div class="proj-chip" id="projChip" title="">未選擇文件</div>
    <div class="head-right">
      <button class="btn ghost small" id="checkUpdate">檢查更新</button>
      <div class="status-chip" id="status"><span class="dot"></span><span id="status-text">待命</span></div>
    </div>
  </header>

  <div class="steps" id="steps">
    <div class="step" data-step="1"><span class="n">1</span><span class="t">分析</span></div>
    <div class="line" data-line="1"></div>
    <div class="step" data-step="2"><span class="n">2</span><span class="t">規劃</span></div>
    <div class="line" data-line="2"></div>
    <div class="step" data-step="3"><span class="n">3</span><span class="t">遷移</span></div>
    <div class="line" data-line="3"></div>
    <div class="step" data-step="4"><span class="n">4</span><span class="t">驗證</span></div>
    <div class="line" data-line="4"></div>
    <div class="step" data-step="5"><span class="n">5</span><span class="t">報告</span></div>
  </div>

  <main>
    <section class="card side">
      <h2>專案</h2>
      <div class="drop-zone" id="dropZone">
        <span class="plus">＋</span>
        <span>加入 Java 文件或 .jar（可多選）</span>
      </div>
      <div class="file-list" id="fileList" hidden></div>
      <div class="grid3">
        <label>目標版本<input id="target" value="26.2"></label>
        <label>目標載入器
          <select id="loaderTo">
            <option value="">不變（僅升版本）</option>
            <option value="neoforge">NeoForge</option>
            <option value="fabric">Fabric</option>
          </select>
        </label>
        <label>環境文檔<input id="env" placeholder="自動（mcenv/）"></label>
      </div>

      <details class="settings">
        <summary>設置（模型・API Key）</summary>
        <div class="grid3">
          <label>供應商
            <select id="provider">
              <option value="deepseek">DeepSeek</option>
              <option value="openai">OpenAI</option>
              <option value="ollama">Ollama（本地）</option>
              <option value="anthropic">Anthropic</option>
              <option value="gemini">Google Gemini</option>
              <option value="openrouter">OpenRouter</option>
              <option value="mock">Mock（離線演示）</option>
            </select>
          </label>
          <label>模型
            <select id="model">
              <option value="">自動（供應商預設）</option>
            </select>
          </label>
          <label>API Key<input id="apiKey" type="password" placeholder="僅存本機"></label>
        </div>
        <div class="hint-text" id="modelHint" hidden></div>
      </details>

      <h2>選項</h2>
      <div class="row opts">
        <label class="num">最大修正次數<input id="maxIterations" type="number" min="1" max="20" value="5"></label>
        <label class="num">單檔上限(MB)<input id="maxFileMb" type="number" min="1" max="50" value="5"></label>
        <label class="grow">建構指令<input id="buildCmd" placeholder="留空＝自動偵測 gradlew"></label>
      </div>
      <div class="checks">
        <label class="check"><input type="checkbox" id="dryRun"><span>僅預覽（dry-run，不寫檔案）</span></label>
        <label class="check"><input type="checkbox" id="noBuild"><span>跳過建構驗證</span></label>
        <label class="check"><input type="checkbox" id="force"><span>強制（git 不乾淨仍繼續）</span></label>
      </div>
    </section>

    <section class="card grow">
      <div class="out-head">
        <h2>進度</h2>
        <button class="btn ghost small" id="clear" disabled>清除</button>
      </div>
      <div class="summary" id="summaryStrip" hidden></div>
      <div class="log" id="log">
        <div class="hint">選擇專案或加入 Java 文件後，點擊下方「開始遷移」。沒有 API Key 可先選 Mock 供應商離線體驗。</div>
      </div>
      <div class="actions" id="actions" hidden>
        <button class="btn ghost" id="openDir">開啟專案資料夾</button>
        <button class="btn ghost" id="saveReport" hidden>另存報告</button>
        <button class="btn ghost" id="savePatch" hidden>另存補丁</button>
      </div>
    </section>
  </main>

  <div class="error" id="error" hidden></div>

  <footer class="actionbar">
    <span class="hint" id="footerText">API Key 僅存本機、不隨專案提交 · 遷移前請確認 git 狀態</span>
    <div class="actions-bar">
      <button class="btn ghost" id="cancel" hidden>取消</button>
      <button class="btn primary" id="run">開始遷移</button>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
